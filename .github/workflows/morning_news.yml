name: Park News Bot Daily Run

on:
  schedule:
    # 매주 월~금요일 한국 시간 아침 5시 (UTC 시간 기준 밤 8시)에 실행
    - cron: '0 20 * * 0-4'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install moviepy gtts pillow requests

      - name: Run news briefing bot
        run: |
          python auto_morning_news.py

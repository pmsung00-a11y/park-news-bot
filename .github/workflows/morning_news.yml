name: Park News Bot Daily Run

on:
  schedule:
    - cron: '0 20 * * 0-4'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Korean Fonts and Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-nanum
          pip install pillow requests

      - name: Run news briefing bot
        run: |
          python auto_morning_news.py

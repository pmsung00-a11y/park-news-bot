name: Weekly Insurance News Collector

on:
  schedule:
    # 한국 시간 기준 매주 금요일 오전 9시 (UTC 0시)
    - cron: '0 0 * * 5'
  workflow_dispatch: # 우리가 지금 당장 수동으로 테스트해 볼 수 있게 해주는 버튼

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser

      - name: Run news collector script
        run: |
          python get_news_insurance.py

      - name: Commit and push collected news file
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add 주간보험뉴스.txt
          git commit -m "Auto-update weekly insurance news txt" || exit 0
          git push

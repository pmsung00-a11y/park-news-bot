name: Weekly Insurance News Collector

on:
  schedule:
    - cron: '0 20 * * 4' # 매주 목요일 밤 20:00 UTC (금요일 아침 5:00 KST)
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m __import__('pip').install --upgrade pip
          pip install feedparser

      - name: Run news collector script
        run: |
          python get_news_insurance.py

      - name: Commit and push collected news file
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add 주간보험뉴스.txt
          git commit -m "Auto-update weekly insurance news txt" || exit 0
          git push
description: 

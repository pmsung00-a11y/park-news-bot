name: 라디오 사연 영상 제작

on:
  workflow_dispatch: # 원할 때 직접 [Run workflow] 버튼을 눌러 실행하도록 설정

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 저장소 코드 불러오기
      uses: actions/checkout@v3

    - name: 파이썬 3.10 환경 설정
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: FFmpeg 설치 (영상 및 오디오 합성 필수 프로그램)
      run: sudo apt-get update && sudo apt-get install -y ffmpeg

    - name: 파이썬 필수 패키지 설치
      run: |
        python -m pip install --upgrade pip
        pip install requests Pillow moviepy==1.0.3

    - name: 라디오 영상 제작 스크립트 실행
      env:
        ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
      run: python auto_radio_video.py

    - name: 완성된 영상 파일(Artifact) 업로드
      uses: actions/upload-artifact@v4
      with:
        name: radio-broadcast-final-video
        path: 교통사고합의_라디오방송_최종.mp4

name: 매주 부동산 뉴스 수집 알람

on:
  schedule:
    # 한국 시간 기준 매주 금요일 오전 9시 (UTC 0시)
    - cron: '0 0 * * 5'
  workflow_dispatch: # 우리가 지금 당장 수동으로 테스트해 볼 수 있게 해주는 버튼

jobs:
  run-crawler:
    runs-on: ubuntu-latest

    steps:
    - name: 내 저장소 코드 가져오기
      uses: actions/checkout@v3

    - name: 파이썬 설치하기
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 필요한 도구(라이브러리) 설치하기
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4

    - name: 심부름꾼(파이썬) 실행하기
      run: python get_news_estate.py

    - name: 모아온 텍스트 파일을 깃허브에 저장하기
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add *.txt
        git commit -m "부동산 주간 뉴스 수집 완료" || echo "새로운 뉴스가 없습니다"
        git push
